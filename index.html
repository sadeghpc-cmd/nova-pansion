document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lch(0.44 0.02 85); max-width: 46ch; text-wrap: pretty\">سالن مطالعه‌ی اختصاصی دخترانه در کرمان. میز و کمد شخصی، سکوت کامل، سانس‌بندی مشخص و گزارش حضور روزانه برای خانواده. ظرفیت محدود به ۴۸ نفر.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 40px\">\n        <a href=\"#visit\" style=\"display: inline-block; padding: 16px 32px; border-radius: 12px; background: oklch(0.45 0.09 155); color: oklch(0.98 0.01 155); font-size: 17px; font-weight: 700\" style-hover=\"background: oklch(0.38 0.09 155)\">اولین روزت مهمان ما باش<\u002Fa>\n        <a href=\"#price\" style=\"display: inline-block; padding: 16px 32px; border-radius: 12px; border: 1px solid oklch(0.82 0.02 85); color: oklch(0.3 0.02 85); font-size: 17px; font-weight: 500\" style-hover=\"border-color: oklch(0.45 0.09 155)\">دیدن تعرفه‌ها<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, auto); gap: 36px; justify-content: start; padding-top: 32px; border-top: 1px solid oklch(0.89 0.02 85)\">\n        <div>\n          <div style=\"font-size: 30px; font-weight: 900; letter-spacing: -0.01em\">۱۲٬۴۰۰<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.52 0.02 85); margin-top: 4px\">ساعت مطالعه در تیر<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 30px; font-weight: 900; letter-spacing: -0.01em\">۷ صبح تا ۱۱ شب<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.52 0.02 85); margin-top: 4px\">سه سانس روزانه<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 30px; font-weight: 900; letter-spacing: -0.01em\">۴۸<\u002Fdiv>\n          <div style=\"font-size: 14px; color: oklch(0.52 0.02 85); margin-top: 4px\">کل جایگاه‌ها<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: relative; aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; background: repeating-linear-gradient(135deg, oklch(0.92 0.02 85) 0 12px, oklch(0.94 0.018 85) 12px 24px); display: grid; place-items: center; border: 1px solid oklch(0.87 0.02 85)\">\n      <div style=\"text-align: center; font-family: ui-monospace, monospace; font-size: 13px; color: oklch(0.5 0.02 85); line-height: 2; padding: 24px\">\n        <div style=\"font-size: 11px; letter-spacing: 0.14em; margin-bottom: 8px\">IMAGE<\u002Fdiv>\n        عکس سالن مطالعه<br>نمای کلی، نور طبیعی، صندلی‌های اشغال‌شده\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"space\" data-reveal=\"1\" style=\"padding: 84px 40px; background: oklch(0.99 0.008 85); border-top: 1px solid oklch(0.9 0.02 85); border-bottom: 1px solid oklch(0.9 0.02 85)\">\n    <div style=\"max-width: 1280px; margin: 0 auto\">\n      <h2 style=\"margin: 0 0 14px; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 46px; font-weight: 400; line-height: 1.3\">چه چیزی می‌گیری<\u002Fh2>\n      <p style=\"margin: 0 0 44px; font-size: 18px; color: oklch(0.48 0.02 85)\">هر عضو یک جایگاه ثابت دارد؛ همان میز، همان کمد، هر روز.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px\">\n        <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div style=\"padding: 28px; border-radius: 14px; background: oklch(0.97 0.014 85); border: 1px solid oklch(0.9 0.02 85)\">\n            <div style=\"width: 34px; height: 34px; border-radius: 9px; background: oklch(0.93 0.03 155); margin-bottom: 18px\"><\u002Fdiv>\n            <h3 style=\"margin: 0 0 8px; font-size: 19px; font-weight: 700\">{{ f.title }}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: oklch(0.48 0.02 85)\">{{ f.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"gallery\" data-reveal=\"1\" style=\"padding: 84px 0 90px\">\n    <div style=\"max-width: 1280px; margin: 0 auto 36px; padding: 0 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 32px\">\n      <div>\n        <h2 style=\"margin: 0 0 14px; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 46px; font-weight: 400; line-height: 1.3\">قبل از ثبت‌نام، فضا را ببین<\u002Fh2>\n        <p style=\"margin: 0; font-size: 18px; color: oklch(0.48 0.02 85)\">فاصله‌ی میزها، ارتفاع سقف، نور و پارتیشن‌ها همه حساب‌شده‌اند.<\u002Fp>\n      <\u002Fdiv>\n      <span style=\"font-size: 14px; color: oklch(0.55 0.02 85); white-space: nowrap\">← بکشید<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 40px 20px\">\n      <sc-for list=\"{{ gallery }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <figure style=\"margin: 0; flex: 0 0 auto; width: 420px; scroll-snap-align: start\">\n          <div style=\"aspect-ratio: 4/3; border-radius: 14px; overflow: hidden; border: 1px solid oklch(0.88 0.02 85); background: repeating-linear-gradient(135deg, oklch(0.92 0.02 85) 0 12px, oklch(0.945 0.018 85) 12px 24px); display: grid; place-items: center\">\n            <div style=\"text-align: center; font-family: ui-monospace, monospace; font-size: 12px; color: oklch(0.5 0.02 85); line-height: 1.9; padding: 20px\">\n              <div style=\"font-size: 10px; letter-spacing: 0.16em; margin-bottom: 6px\">IMAGE<\u002Fdiv>\n              {{ g.slot }}\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption style=\"margin-top: 14px; font-size: 16px; color: oklch(0.34 0.02 85)\">{{ g.caption }}<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"seats\" data-reveal=\"1\" style=\"padding: 84px 40px; max-width: 1280px; margin: 0 auto\">\n    <div style=\"display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 56px; align-items: center\">\n      <div>\n        <h2 style=\"margin: 0 0 18px; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 46px; font-weight: 400; line-height: 1.3\">جایگاه‌های آزادِ همین امروز<\u002Fh2>\n        <p style=\"margin: 0 0 26px; font-size: 18px; line-height: 1.85; color: oklch(0.48 0.02 85); text-wrap: pretty\">پلان واقعی سالن. جایگاه خالی را انتخاب کن و همان را برایت نگه می‌داریم. ظرفیت را عمداً محدود نگه داشته‌ایم تا سکوت و رسیدگی حفظ شود.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 15px\">\n          <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 16px; height: 16px; border-radius: 5px; background: oklch(0.93 0.03 155); border: 1px solid oklch(0.75 0.06 155)\"><\u002Fspan> آزاد<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 16px; height: 16px; border-radius: 5px; background: oklch(0.88 0.015 85); border: 1px solid oklch(0.82 0.02 85)\"><\u002Fspan> رزرو‌شده<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 16px; height: 16px; border-radius: 5px; background: oklch(0.45 0.09 155)\"><\u002Fspan> انتخاب تو<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 28px; font-size: 17px; font-weight: 500; color: oklch(0.38 0.09 155)\">{{ pickedLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 32px; border-radius: 18px; background: oklch(0.99 0.008 85); border: 1px solid oklch(0.9 0.02 85)\">\n        <div style=\"display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px\">\n          <sc-for list=\"{{ seats }}\" as=\"s\" hint-placeholder-count=\"48\">\n            <button sc-camel-on-click=\"{{ s.onPick }}\" title=\"{{ s.label }}\" style=\"{{ s.style }}\"><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top: 26px; padding-top: 20px; border-top: 1px solid oklch(0.91 0.02 85); display: flex; justify-content: space-between; font-size: 14px; color: oklch(0.52 0.02 85)\">\n          <span>ورودی و میز پذیرش<\u002Fspan>\n          <span>پنجره‌های شمالی<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"price\" data-reveal=\"1\" style=\"padding: 84px 40px; background: oklch(0.24 0.02 85); color: oklch(0.96 0.01 85)\">\n    <div style=\"max-width: 1280px; margin: 0 auto\">\n      <h2 style=\"margin: 0 0 14px; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 46px; font-weight: 400; line-height: 1.3\">تعرفه، بدون تماس گرفتن<\u002Fh2>\n      <p style=\"margin: 0 0 44px; font-size: 18px; color: oklch(0.74 0.015 85)\">قیمت‌ها را همین‌جا می‌نویسیم. بی‌خبری بخشی از فروش ما نیست.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px\">\n        <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"{{ p.cardStyle }}\">\n            <div style=\"font-size: 15px; font-weight: 500; color: oklch(0.72 0.015 85); margin-bottom: 14px\">{{ p.name }}<\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px\">\n              <span style=\"font-size: 42px; font-weight: 900; letter-spacing: -0.02em\">{{ p.price }}<\u002Fspan>\n              <span style=\"font-size: 15px; color: oklch(0.72 0.015 85)\">{{ p.unit }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.7; color: oklch(0.82 0.012 85)\">\n              <sc-for list=\"{{ p.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div>{{ it }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin: 28px 0 0; font-size: 15px; color: oklch(0.7 0.015 85)\">هر ۲۰ روز حضور پیوسته، ۲ روز هدیه. معرفی دوست: ۱۰٪ تخفیف برای هر دو نفر.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"parents\" data-reveal=\"1\" style=\"padding: 84px 40px; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center\">\n    <div>\n      <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.1em; color: oklch(0.5 0.09 155); margin-bottom: 16px\">برای خانواده‌ها<\u002Fdiv>\n      <h2 style=\"margin: 0 0 20px; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 46px; font-weight: 400; line-height: 1.3\">هر شب می‌دانید امروز چند ساعت خوانده<\u002Fh2>\n      <p style=\"margin: 0 0 26px; font-size: 18px; line-height: 1.85; color: oklch(0.48 0.02 85); text-wrap: pretty\">ورود و خروج ثبت می‌شود و گزارش ساعت حضور و جمع‌بندی هفتگی مشاور، با یک لینک اختصاصی در دسترس شماست. نیازی به تماس و پرسیدن نیست.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; font-size: 16px; color: oklch(0.34 0.02 85)\">\n        <div>— حیاط و فضای استراحت مجزا از سالن مطالعه<\u002Fdiv>\n        <div>— محیط کاملاً دخترانه، دوربین مداربسته در راهروها<\u002Fdiv>\n        <div>— سانس شب‌های امتحان تا ساعت ۲ بامداد<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; place-items: center\">\n      <div style=\"width: 344px; padding: 12px; border-radius: 46px; background: oklch(0.24 0.02 85); box-shadow: 0 30px 60px -20px oklch(0.24 0.02 85 / 0.4)\">\n        <div style=\"border-radius: 36px; overflow: hidden; background: oklch(0.98 0.01 85)\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 14px 24px 8px; font-size: 12px; color: oklch(0.45 0.02 85)\">\n            <span>۲۱:۴۰<\u002Fspan>\n            <span style=\"width: 62px; height: 20px; border-radius: 999px; background: oklch(0.24 0.02 85); margin-top: -10px\"><\u002Fspan>\n            <span>۸۴٪<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 14px 22px 20px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px\">\n              <span style=\"font-family: Lalezar, Vazirmatn, sans-serif; font-size: 20px\">پنل نُوا<\u002Fspan>\n              <span style=\"font-size: 12px; padding: 5px 10px; border-radius: 999px; background: oklch(0.93 0.03 155); color: oklch(0.38 0.09 155)\">امروز<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 18px; border-radius: 14px; background: oklch(0.29 0.03 155); color: oklch(0.96 0.01 85); margin-bottom: 16px\">\n              <div style=\"font-size: 13px; color: oklch(0.8 0.03 155); margin-bottom: 6px\">مطالعه‌ی مؤثر امروز<\u002Fdiv>\n              <div style=\"font-family: Lalezar, Vazirmatn, sans-serif; font-size: 34px; line-height: 1.2\">۶ ساعت و ۴۰ دقیقه<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 0; margin-bottom: 18px\">\n              <sc-for list=\"{{ log }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid oklch(0.92 0.02 85); font-size: 14px\">\n                  <span style=\"display: flex; align-items: center; gap: 9px; color: oklch(0.34 0.02 85)\">\n                    <span style=\"{{ l.dot }}\"><\u002Fspan>\n                    {{ l.kind }}\n                  <\u002Fspan>\n                  <span style=\"color: oklch(0.5 0.02 85); font-variant-numeric: tabular-nums\">{{ l.time }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px\">\n              <span style=\"font-size: 14px; font-weight: 700\">هفته‌ی جاری<\u002Fspan>\n              <span style=\"font-size: 12px; color: oklch(0.52 0.02 85)\">۵۲ ساعت و ۳۰ دقیقه<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; align-items: end; height: 74px\">\n              <sc-for list=\"{{ week }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end\">\n                  <div style=\"{{ d.barStyle }}\"><\u002Fdiv>\n                  <span style=\"font-size: 11px; color: oklch(0.55 0.02 85)\">{{ d.day }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"visit\" data-reveal=\"1\" style=\"padding: 92px 40px; background: oklch(0.93 0.03 155)\">\n    <div style=\"max-width: 720px; margin: 0 auto; text-align: center\">\n      <h2 style=\"margin: 0 0 18px; font-family: Lalezar, Vazirmatn, sans-serif; font-size: 52px; font-weight: 400; line-height: 1.28\">یک روز کامل، مهمان ما<\u002Fh2>\n      <p style=\"margin: 0 0 36px; font-size: 19px; line-height: 1.8; color: oklch(0.4 0.04 155)\">بیا، از صبح تا شب بخوان، بعد تصمیم بگیر. بدون پیش‌پرداخت و بدون تعهد.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px; text-align: right\">\n        <input placeholder=\"نام و نام خانوادگی\" style=\"padding: 16px 18px; border-radius: 11px; border: 1px solid oklch(0.8 0.04 155); background: oklch(0.99 0.008 85); font-family: Vazirmatn, sans-serif; font-size: 16px; outline: none\">\n        <input placeholder=\"شماره موبایل\" style=\"padding: 16px 18px; border-radius: 11px; border: 1px solid oklch(0.8 0.04 155); background: oklch(0.99 0.008 85); font-family: Vazirmatn, sans-serif; font-size: 16px; outline: none\">\n        <input placeholder=\"پایه و رشته تحصیلی\" style=\"grid-column: span 2; padding: 16px 18px; border-radius: 11px; border: 1px solid oklch(0.8 0.04 155); background: oklch(0.99 0.008 85); font-family: Vazirmatn, sans-serif; font-size: 16px; outline: none\">\n        <button style=\"grid-column: span 2; padding: 18px; border: none; border-radius: 11px; background: oklch(0.38 0.09 155); color: oklch(0.98 0.01 155); font-family: Vazirmatn, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer\" style-hover=\"background: oklch(0.31 0.09 155)\">ثبت روز رایگان<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin: 20px 0 0; font-size: 15px; color: oklch(0.44 0.04 155)\">یا در واتساپ پیام بده: ۰۹۱۳ ۰۰۰ ۰۰۰۰<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding: 64px 40px; background: oklch(0.24 0.02 85); color: oklch(0.82 0.012 85)\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 48px\">\n      <div>\n        <div style=\"font-size: 20px; font-weight: 900; color: oklch(0.96 0.01 85); margin-bottom: 14px\">پانسیون مطالعه نُوا<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.9\">سالن مطالعه‌ی دخترانه<br>کرمان، خیابان ——، کوچه ——، پلاک —<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-size: 15px; line-height: 2.1\">\n        <div style=\"color: oklch(0.96 0.01 85); font-weight: 700; margin-bottom: 10px\">ساعات کاری<\u002Fdiv>\n        شنبه تا پنجشنبه: ۷ تا ۲۳<br>جمعه: ۸ تا ۲۰<br>شب‌های امتحان: تا ۲ بامداد\n      <\u002Fdiv>\n      <div style=\"aspect-ratio: 16/7; border-radius: 12px; background: repeating-linear-gradient(135deg, oklch(0.3 0.02 85) 0 12px, oklch(0.32 0.02 85) 12px 24px); display: grid; place-items: center; font-family: ui-monospace, monospace; font-size: 13px; color: oklch(0.68 0.015 85); text-align: center\">\n        MAP<br>نقشه‌ی بلد / گوگل‌مپ\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst TAKEN = [0,1,4,5,8,11,12,16,17,19,22,25,26,29,31,33,34,38,40,41,44,45];\nclass Component extends DCLogic {\n  state = { picked: null };\n  componentDidMount() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const setup = () => {\n      const els = document.querySelectorAll('[data-reveal]:not([data-revealed])');\n      if (!els.length) return;\n      const io = new IntersectionObserver(entries => {\n        entries.forEach(e => {\n          if (!e.isIntersecting) return;\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          io.unobserve(e.target);\n        });\n      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.06 });\n      els.forEach(el => {\n        el.setAttribute('data-revealed', '1');\n        const r = el.getBoundingClientRect();\n        const below = r.top > window.innerHeight * 0.9;\n        el.style.transition = 'opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1)';\n        if (below) { el.style.opacity = '0'; el.style.transform = 'translateY(26px)'; }\n        io.observe(el);\n      });\n    };\n    requestAnimationFrame(() => requestAnimationFrame(setup));\n  }\n  renderVals() {\n    const fa = n => String(n).replace(/\\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);\n    const picked = this.state.picked;\n    const seats = Array.from({ length: 48 }, (_, i) => {\n      const taken = TAKEN.includes(i);\n      const isPicked = picked === i;\n      const bg = isPicked ? 'oklch(0.45 0.09 155)' : taken ? 'oklch(0.88 0.015 85)' : 'oklch(0.93 0.03 155)';\n      const bd = isPicked ? 'oklch(0.45 0.09 155)' : taken ? 'oklch(0.82 0.02 85)' : 'oklch(0.75 0.06 155)';\n      return {\n        label: taken ? 'رزرو‌شده' : 'جایگاه ' + fa(i + 1),\n        style: `aspect-ratio:1;border-radius:7px;border:1px solid ${bd};background:${bg};cursor:${taken ? 'not-allowed' : 'pointer'};padding:0;transition:transform .12s`,\n        onPick: taken ? () => {} : () => this.setState({ picked: i })\n      };\n    });\n    const free = 48 - TAKEN.length;\n    const hours = [9.5, 8, 7, 10, 6.5, 5.5, 6];\n    return {\n      seats,\n      freeSeatsLabel: `${fa(free)} جایگاه آزاد برای مرداد`,\n      pickedLabel: picked === null ? 'یک جایگاه از پلان انتخاب کن' : `جایگاه ${fa(picked + 1)} برای تو نگه داشته شد.`,\n      features: [\n        { title: 'میز و کمد اختصاصی', body: 'جایگاه ثابت با پارتیشن، چراغ مطالعه و کمد قفل‌دار شخصی. کتاب‌هایت را هر شب جابه‌جا نمی‌کنی.' },\n        { title: 'سکوت واقعی', body: 'ورود و خروج فقط بین سانس‌ها. موبایل در ورودی تحویل داده می‌شود.' },\n        { title: 'مشاور حاضر در سالن', body: 'برنامه‌ریزی هفتگی و رفع اشکال، بدون هزینه‌ی جدا.' },\n        { title: 'فضای استراحت و تغذیه', body: 'آشپزخانه، چای و حیاط سرپوشیده، کاملاً جدا از سالن مطالعه.' },\n        { title: 'آزمون‌های جمعه', body: 'آزمون هفتگی در محل، همراه با تحلیل کارنامه.' },\n        { title: 'اینترنت و منابع', body: 'وای‌فای، پرینتر و آرشیو کتاب‌های کمک‌درسی و آزمون‌های سال‌های گذشته.' }\n      ],\n      plans: [\n        { name: 'روزانه', price: '۹۵', unit: 'هزار تومان', items: ['یک سانس دلخواه', 'جایگاه آزاد', 'بدون ثبت‌نام'], cardStyle: 'padding:32px;border-radius:16px;border:1px solid oklch(0.36 0.02 85);background:oklch(0.27 0.02 85)' },\n        { name: 'ماهانه — پرطرفدار', price: '۱٫۴', unit: 'میلیون تومان', items: ['جایگاه ثابت و کمد شخصی', 'هر سه سانس', 'مشاوره و آزمون هفتگی', 'گزارش حضور برای والدین'], cardStyle: 'padding:32px;border-radius:16px;border:1px solid oklch(0.55 0.14 155);background:oklch(0.29 0.03 155)' },\n        { name: 'کارت ۱۰۰ ساعته', price: '۷۸۰', unit: 'هزار تومان', items: ['ساعت‌ها را هر وقت خواستی خرج کن', 'اعتبار شش‌ماهه', 'مناسب دانشجو'], cardStyle: 'padding:32px;border-radius:16px;border:1px solid oklch(0.36 0.02 85);background:oklch(0.27 0.02 85)' }\n      ],\n      gallery: [\n        { slot: 'سالن اصلی، نمای کلی', caption: 'سالن اصلی — ۳۲ جایگاه پارتیشن‌دار' },\n        { slot: 'نمای نزدیک یک میز و کمد', caption: 'هر جایگاه: چراغ مطالعه، پریز، کمد قفل‌دار' },\n        { slot: 'آشپزخانه و فضای تغذیه', caption: 'آشپزخانه و اتاق استراحت' },\n        { slot: 'حیاط سرپوشیده', caption: 'حیاط — برای بین دو سانس' },\n        { slot: 'اتاق مشاوره', caption: 'اتاق مشاوره و رفع اشکال' }\n      ],\n      log: [\n        { kind: 'ورود', time: '۰۷:۵۲', dot: 'width:8px;height:8px;border-radius:999px;background:oklch(0.55 0.14 155)' },\n        { kind: 'استراحت', time: '۱۲:۱۰', dot: 'width:8px;height:8px;border-radius:999px;background:oklch(0.78 0.02 85)' },\n        { kind: 'بازگشت به سالن', time: '۱۲:۴۵', dot: 'width:8px;height:8px;border-radius:999px;background:oklch(0.55 0.14 155)' },\n        { kind: 'خروج', time: '۲۱:۰۵', dot: 'width:8px;height:8px;border-radius:999px;background:oklch(0.6 0.02 85)' }\n      ],\n      week: ['ش','ی','د','س','چ','پ','ج'].map((day, i) => ({\n        day,\n        barStyle: `width:100%;height:${(hours[i] / 10) * 100}%;border-radius:6px 6px 3px 3px;background:oklch(${0.62 - i * 0.01} 0.09 155)`\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
